name: Uptime check

# Runs every 15 minutes. If the site, the database link or a listing page is
# broken, the run fails (GitHub emails the repo owner) and an issue is opened.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check site
        id: check
        run: |
          fail=0
          check() {
            url="$1"; needle="$2"
            for i in 1 2 3; do
              body=$(curl -sL --max-time 20 -w '\n%{http_code}' "$url") && code=$(echo "$body" | tail -n1)
              if [ "$code" = "200" ] && echo "$body" | grep -q "$needle"; then echo "OK $url"; return 0; fi
              sleep 10
            done
            echo "FAIL $url (status $code)"; fail=1
          }
          check https://www.elsahaba.homes/ "الصحابة"
          check https://www.elsahaba.homes/api/keepalive '"ok"'
          check https://www.elsahaba.homes/sitemap.xml "<urlset"
          check https://www.elsahaba.homes/property/7 "الصحابة العقارية"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          exit $fail
      - name: Open an issue when down
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'site-down' });
            if (open.data.length === 0) {
              await github.rest.issues.create({ ...context.repo, title: 'الموقع فيه مشكلة (uptime check failed)', labels: ['site-down'], body: 'The automatic check failed. See the run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId });
            }
